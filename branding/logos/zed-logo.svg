<svg xmlns="http://www.w3.org/2000/svg" viewBox="-256 -256 512 512" width="512" height="512">
  <title>Zed</title>
  <!--
    Zed logo. Six lambda arms around a hexagonal core, in the spirit of the
    NixOS snowflake but drawn independently, mirrored so the arms sweep to
    the left, in two crimson tones. A katana crosses it diagonally with the
    handle at the upper right.
  -->
  <defs>
    <!-- One lambda arm, pointing up. Long leg plus a short branch. -->
    <path id="arm" d="M -44.0 -62.0 L -6.0 -62.0 L 86.4 -222.0 L 48.4 -222.0 Z M 2.2 -142.0 L 40.2 -142.0 L 86.4 -62.0 L 48.4 -62.0 Z"/>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d9de"/>
      <stop offset="0.55" stop-color="#f4f4f6"/>
      <stop offset="1" stop-color="#9a9aa3"/>
    </linearGradient>
  </defs>

  <g transform="scale(-1,1)">
    <use href="#arm" fill="#c41e3a" transform="rotate(0)"/>
    <use href="#arm" fill="#7d1022" transform="rotate(60)"/>
    <use href="#arm" fill="#c41e3a" transform="rotate(120)"/>
    <use href="#arm" fill="#7d1022" transform="rotate(180)"/>
    <use href="#arm" fill="#c41e3a" transform="rotate(240)"/>
    <use href="#arm" fill="#7d1022" transform="rotate(300)"/>
  </g>

  <!-- Katana: blade from lower left, guard and wrapped handle at upper right. -->
  <g transform="rotate(-45)">
    <!-- blade with a slight curve (sori) and a sharp kissaki -->
    <path d="M -236 6 Q -60 -10 118 -6 L 118 7 Q -60 6 -214 14 Z" fill="url(#blade)" stroke="#0b0b0d" stroke-width="3"/>
    <!-- habaki (blade collar) -->
    <rect x="116" y="-9" width="12" height="19" fill="#b08d3a" stroke="#0b0b0d" stroke-width="2"/>
    <!-- tsuba (guard) -->
    <ellipse cx="134" cy="0.5" rx="7" ry="24" fill="#1a1a1e" stroke="#c41e3a" stroke-width="3"/>
    <!-- tsuka (handle) with diamond wrap -->
    <rect x="141" y="-8" width="92" height="17" rx="4" fill="#141416" stroke="#0b0b0d" stroke-width="2"/>
    <path d="M 147 -8 l 8 8.5 l -8 8.5 M 163 -8 l 8 8.5 l -8 8.5 M 179 -8 l 8 8.5 l -8 8.5 M 195 -8 l 8 8.5 l -8 8.5 M 211 -8 l 8 8.5 l -8 8.5"
          fill="none" stroke="#c41e3a" stroke-width="3" stroke-linejoin="round"/>
    <!-- kashira (pommel) -->
    <rect x="231" y="-9" width="8" height="19" rx="2" fill="#b08d3a" stroke="#0b0b0d" stroke-width="2"/>
  </g>
</svg>
