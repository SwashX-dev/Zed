<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 3840 2160" width="3840" height="2160">
  <title>Zed — Katana</title>
  <defs>
    <radialGradient id="glow" cx="0.7" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2a0a10"/>
      <stop offset="0.45" stop-color="#140608"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c41e3a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c41e3a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c41e3a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55555c"/>
      <stop offset="0.6" stop-color="#d9d9de"/>
      <stop offset="1" stop-color="#6a6a72"/>
    </linearGradient>
    <path id="arm" d="M -44.0 -62.0 L -6.0 -62.0 L 86.4 -222.0 L 48.4 -222.0 Z M 2.2 -142.0 L 40.2 -142.0 L 86.4 -62.0 L 48.4 -62.0 Z"/>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="3840" height="2160" fill="url(#glow)"/>
  <rect width="3840" height="2160" fill="url(#grid)"/>

  <!-- Large snowflake watermark -->
  <g transform="translate(2620 1000) scale(3.6) scale(-1 1)" opacity="0.9">
    <use href="#arm" fill="#c41e3a" opacity="0.55"/>
    <use href="#arm" fill="#7d1022" opacity="0.55" transform="rotate(60)"/>
    <use href="#arm" fill="#c41e3a" opacity="0.55" transform="rotate(120)"/>
    <use href="#arm" fill="#7d1022" opacity="0.55" transform="rotate(180)"/>
    <use href="#arm" fill="#c41e3a" opacity="0.55" transform="rotate(240)"/>
    <use href="#arm" fill="#7d1022" opacity="0.55" transform="rotate(300)"/>
  </g>

  <!-- The cut: a long diagonal slash across the whole frame -->
  <g transform="translate(2620 1000) rotate(-45)">
    <rect x="-2600" y="-7" width="5200" height="14" fill="url(#slash)"/>
    <rect x="-2600" y="-1.5" width="5200" height="3" fill="#ff5a73" opacity="0.6"/>
  </g>

  <!-- Katana silhouette along the slash, handle upper right -->
  <g transform="translate(2620 1000) rotate(-45) scale(3.6)" opacity="0.95">
    <path d="M -236 6 Q -60 -10 118 -6 L 118 7 Q -60 6 -214 14 Z" fill="url(#blade)"/>
    <rect x="116" y="-9" width="12" height="19" fill="#8a6d2a"/>
    <ellipse cx="134" cy="0.5" rx="7" ry="24" fill="#111114" stroke="#c41e3a" stroke-width="3"/>
    <rect x="141" y="-8" width="92" height="17" rx="4" fill="#111114"/>
    <path d="M 147 -8 l 8 8.5 l -8 8.5 M 163 -8 l 8 8.5 l -8 8.5 M 179 -8 l 8 8.5 l -8 8.5 M 195 -8 l 8 8.5 l -8 8.5 M 211 -8 l 8 8.5 l -8 8.5"
          fill="none" stroke="#c41e3a" stroke-width="3" stroke-linejoin="round"/>
    <rect x="231" y="-9" width="8" height="19" rx="2" fill="#8a6d2a"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, 'DejaVu Sans', sans-serif" fill="#f2f2f4">
    <text x="300" y="1760" font-size="300" font-weight="900" letter-spacing="60">ZED</text>
    <rect x="306" y="1810" width="560" height="10" fill="#c41e3a"/>
    <text x="306" y="1900" font-size="56" font-weight="500" letter-spacing="18" fill="#9b9ba3">DECLARATIVE · SUPERVISED · SHARP</text>
  </g>
</svg>
