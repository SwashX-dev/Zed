mode: optionalmultiple
method: legacy
labels:
    step: "Software"
items:
    - id: "collection:network-analysis"
      name: "Network analysis tools"
      description: "<html>Wireshark, tcpdump, Nmap, termshark, iperf3, mtr, dig, socat, netcat.</html>"
    - id: "collection:web-assessment"
      name: "Web application assessment tools"
      description: "<html>OWASP ZAP, sqlmap, Nikto, ffuf, gobuster, WhatWeb. For applications you are authorised to test.</html>"
    - id: "collection:forensics"
      name: "Digital forensics tools"
      description: "<html>The Sleuth Kit, Autopsy, TestDisk/PhotoRec, binwalk, foremost, ExifTool, ddrescue.</html>"
    - id: "collection:reverse-engineering"
      name: "Reverse engineering tools"
      description: "<html>Ghidra, radare2, rizin, Cutter, GDB, ImHex, binutils.</html>"
    - id: "collection:password-auditing"
      name: "Password auditing tools"
      description: "<html>John the Ripper and hashcat, for hashes you are responsible for.</html>"
    - id: "collection:wireless"
      name: "Wireless analysis tools"
      description: "<html>Aircrack-ng, Kismet, wavemon. For networks you own or are authorised to test.</html>"
    - id: "pkg:thunderbird"
      name: "Thunderbird"
      description: "<html>Email, calendar and contacts.</html>"
    - id: "pkg:vscodium"
      name: "VSCodium"
      description: "<html>Code editor (Visual Studio Code without Microsoft telemetry).</html>"
    - id: "opt:unfree"
      name: "Allow proprietary software"
      description: "<html>Lets Zed install software that is not free/open source, such as NVIDIA's driver. Proprietary software cannot be audited and is not on the installation medium.</html>"
    - id: "opt:nvidia"
      name: "Proprietary NVIDIA driver"
      description: "<html>Better performance and power management on NVIDIA GPUs (Maxwell, 2014, and newer) than the free nouveau driver. Needs <b>Allow proprietary software</b> and a network connection: the driver is downloaded and built during installation. Ignored if no NVIDIA GPU is found.</html>"
