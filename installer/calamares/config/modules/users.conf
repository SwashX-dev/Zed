---
# Zed administers through sudo; the root account stays locked.
defaultGroups:
    - users
    - wheel
setRootPassword: false
doReusePassword: false
doAutologin: false
passwordRequirements:
    minLength: 8
    maxLength: 128
    libpwquality:
        - minlen=8
        - maxrepeat=3
        - maxsequence=3
        - usersubstr=4
allowWeakPasswords: false
user:
  shell: /run/current-system/sw/bin/bash
  forbidden_names: [ root, greeter, zedlog, nixbld ]
hostname:
  location: None
  writeHostsFile: false
  template: "zed-${cpu}"
  forbidden_names: [ localhost ]
