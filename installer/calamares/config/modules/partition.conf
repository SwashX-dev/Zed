---
efi:
    mountPoint: "/boot"
    recommendedSize: 1GiB
    minimumSize: 300MiB
    label: "ZED-EFI"
# Never preselect a destructive option: the user chooses explicitly between
# installing alongside, replacing a partition, erasing a disk or manual
# partitioning, and Calamares lists every partition that will be erased.
initialPartitioningChoice: none
initialSwapChoice: small
userSwapChoices:
    - none
    - small
    - suspend
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
drawNestedPartitions: true
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: false
defaultFileSystemType: "ext4"
availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs
partitionLayout:
    - name: "zed-root"
      filesystem: "unknown"
      noEncrypt: false
      mountPoint: "/"
      size: 100%
