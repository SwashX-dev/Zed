mode: required
method: legacy
labels:
    step: "Edition"
default: desktop
items:
    - id: minimal
      name: "Zed Minimal"
      description: "<html>Text console only: the s6 base system, networking, the firewall and the <tt>zed</tt> system manager.<br/><br/><b>Disk:</b> about 3 GB · <b>Memory:</b> 512 MB<br/>For servers and building your own setup. A desktop can be added later with <tt>zed config set desktop.enable true</tt>.</html>"
      screenshot: "editions/minimal.png"
    - id: desktop
      name: "Zed Desktop"
      description: "<html>The Zed desktop with a web browser, file manager and terminal. No security tools are preinstalled; add them any time with <tt>zed install</tt>.<br/><br/><b>Disk:</b> about 8 GB · <b>Memory:</b> 2 GB</html>"
      screenshot: "editions/desktop.png"
    - id: privacy
      name: "Zed Privacy"
      description: "<html>The desktop with the private network profile (randomised MAC addresses, no host name in DHCP requests, IPv6 privacy addresses), Tor Browser, Mullvad Browser, KeePassXC, OnionShare and metadata removal tools.<br/><br/><b>It does not make the computer anonymous.</b> Use Tor Browser for anonymous browsing.<br/><br/><b>Disk:</b> about 10 GB · <b>Memory:</b> 2 GB</html>"
      screenshot: "editions/privacy.png"
    - id: security
      name: "Zed Security Essentials"
      description: "<html>The desktop with network analysis, web assessment, forensics, reverse engineering, cryptography and incident response collections.<br/><br/>Use these tools only on systems you own or are explicitly authorised to test.<br/><br/><b>Disk:</b> about 16 GB · <b>Memory:</b> 4 GB</html>"
      screenshot: "editions/security.png"
    - id: complete
      name: "Zed Complete"
      description: "<html>Everything in Privacy and Security Essentials plus password auditing and wireless analysis.<br/><br/><b>Disk:</b> about 20 GB · <b>Memory:</b> 4 GB or more</html>"
      screenshot: "editions/complete.png"
