# Zed installer (Calamares).  @zedmodules@ is replaced at build time.
---
modules-search: [ local, @zedmodules@ ]

instances:
- id: profile
  module: packagechooser
  config: packagechooser-profile.conf
- id: desktops
  module: packagechooser
  config: packagechooser-desktops.conf
- id: extras
  module: packagechooser
  config: packagechooser-extras.conf
- id: drives
  module: notesqml
  config: notesqml-drives.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - users
  - packagechooser@profile
  - packagechooser@desktops
  - packagechooser@extras
  - notesqml@drives
  - partition
  - summary
- exec:
  # zedcheck runs before partitioning: an invalid choice stops here, with
  # every disk untouched.
  - zedcheck
  - partition
  - mount
  - zedinstall
  - users
  - umount
- show:
  - finished

branding: zed
# Ask once more before the first change to any disk.
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
